[build-system]
requires = [
    "setuptools>=46.1.0",
    "setuptools_scm[toml]>=10.3.4",
    "cmake",
    "pybind11",
    "numpy",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[tool.ruff]
line-length = 120
src = [
    "src",
]
exclude = [
    "tests",
    "docs",
]

[tool.ruff.lint]
extend-ignore = [
    "F821",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "E402",
    "F401",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20

[tool.black]
force-exclude = "__init__.py"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing"
testpaths = [
    "tests",
]

[project.optional-dependencies]
testing = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B110"]
